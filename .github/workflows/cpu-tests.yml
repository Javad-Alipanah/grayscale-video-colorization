name: CPU regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-cpu.txt
      - name: Check public contents
        run: python scripts/check_public_tree.py
      - name: Run unit and real-media integration tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the complete portable CPU workflow
        run: python scripts/smoke_passthrough.py
