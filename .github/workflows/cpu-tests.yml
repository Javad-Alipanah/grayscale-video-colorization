name: CPU regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-cpu.txt
      - name: Check public contents
        run: python scripts/check_public_tree.py
      - name: Run unit and real-media integration tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the complete portable CPU workflow
        run: python scripts/smoke_passthrough.py
